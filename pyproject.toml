[project]
name = "neuro-symbolic"
version = "0.1.0"
description = "Neuro-Symbolic Research System: LangGraph + Clingo + Neo4j"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LangGraph & LangChain
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    # Symbolic Reasoning
    "clingo>=5.7.0",
    # Knowledge Graph
    "neo4j>=5.0.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "slowapi>=0.1.9",
    "sse-starlette>=2.0.0",
    # Validation & Config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Resilience & Observability
    "structlog>=24.0.0",
    "tenacity>=9.0.0",
    # HTTP client (for academic APIs)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers>=4.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = [
    "graph",
    "reasoner",
    "extractors",
    "knowledge_base",
    "research",
    "api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
